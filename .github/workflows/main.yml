name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: [self-hosted, windows, x64]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Python
        run: python --version

      - name: Verify Ollama
        run: |
          python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:11434/api/tags').read().decode())"

      - name: Run AI Code Review
        run: |
          python scripts/ci_review.py test-data

      - name: Show review report
        shell: pwsh
        run: |
          Get-Content ai-review-report.json

      - name: Upload review report
        uses: actions/upload-artifact@v5
        with:
          name: ai-review-report
          path: ai-review-report.json
